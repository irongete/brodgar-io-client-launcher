# A push to master publishes the next version, v1 -> v2, the way it is done by hand: publish.ps1, which counts
# the number from GitHub, builds, tags, pushes the tag and creates the release with the zips. The Run workflow
# button takes a number instead. A Windows runner cuts every platform's runtime with the jlink of the JDK the
# build runs on: Windows' from that JDK, Linux's and macOS's from their own jmods, fetched here for that very
# version. A macOS runner then adds the macOS disk image to the release (the dmg job). The Steam Workshop is not
# here: publish-steam.ps1 needs the Steam client, logged in.
name: Publish
run-name: brodgar-io-launcher-${{ inputs.version && format('v{0}', inputs.version) || 'next' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "That number instead of the counted one"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

# what build.properties names on a development machine, fetched here: the JDK is the one ant runs on (Temurin,
# with jlink), the OpenJFX jmods of each platform are its runtime's JavaFX, the Temurin jmods of Linux and macOS
# their Java; and ant itself, which the runner image lacks
env:
  JDK: '25'
  JAVAFX: '25.0.3'
  ANT: '1.10.15'

jobs:
  publish:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # a commit that carries a tag was published by hand
      - name: Skip a commit published by hand
        id: tagged
        run: |
          $tags = git tag --points-at HEAD 'v*'
          if ($tags) {
            "skip=true" >> $env:GITHUB_OUTPUT
            "HEAD is already $tags`: published by hand, nothing to do." | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/setup-java@v4
        if: steps.tagged.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ env.JDK }}

      # Each OpenJFX zip holds javafx-jmods-<version>, so each is unpacked in a folder of its own. The Temurin jmods
      # must be of this JDK's very version (SEMANTIC_VERSION in its release file): jlink refuses any other.
      - name: Ant, OpenJFX and the jmods
        if: steps.tagged.outputs.skip != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://archive.apache.org/dist/ant/binaries/apache-ant-$env:ANT-bin.zip" -OutFile "$env:RUNNER_TEMP\ant.zip"
          Expand-Archive "$env:RUNNER_TEMP\ant.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\apache-ant-$env:ANT\bin" >> $env:GITHUB_PATH
          $jdk = [regex]::Match((Get-Content "$env:JAVA_HOME\release" -Raw), 'SEMANTIC_VERSION="([^"]+)"').Groups[1].Value
          if (-not $jdk) { throw "$env:JAVA_HOME\release names no SEMANTIC_VERSION" }
          $lines = @()
          foreach ($p in @(@{ id = 'windows-x64'; fx = 'windows-x64' },
                           @{ id = 'linux-x64'; fx = 'linux-x64'; os = 'linux'; arch = 'x64' },
                           @{ id = 'macos-arm64'; fx = 'osx-aarch64'; os = 'mac'; arch = 'aarch64' })) {
            $dir = "$env:RUNNER_TEMP\javafx-$($p.id)"
            Invoke-WebRequest "https://download2.gluonhq.com/openjfx/$env:JAVAFX/openjfx-${env:JAVAFX}_$($p.fx)_bin-jmods.zip" -OutFile "$dir.zip"
            Expand-Archive "$dir.zip" -DestinationPath $dir
            $fx = "$dir\javafx-jmods-$env:JAVAFX" -replace '\\', '/'
            if ($p.id -eq 'windows-x64') { $lines += "javafx.home=$fx"; continue }
            $lines += "javafx.jmods.$($p.id)=$fx"
            $dir = "$env:RUNNER_TEMP\jdk-$($p.id)"
            Invoke-WebRequest "https://api.adoptium.net/v3/binary/version/jdk-$([uri]::EscapeDataString($jdk))/$($p.os)/$($p.arch)/jmods/hotspot/normal/eclipse" -OutFile "$dir.tar.gz"
            New-Item -ItemType Directory $dir | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xzf "$dir.tar.gz" -C $dir
            if ($LASTEXITCODE -ne 0) { throw "the Temurin jmods of $($p.id) could not be unpacked" }
            $lines += "jdk.jmods.$($p.id)=" + ((Get-ChildItem $dir -Directory | Select-Object -First 1).FullName -replace '\\', '/')
          }
          $lines | Set-Content build.properties -Encoding ascii
          Get-Content build.properties

      - name: Publish
        if: steps.tagged.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $arguments = @{ Yes = $true }
          if ($env:VERSION) { $arguments.Version = $env:VERSION }
          ./publish.ps1 @arguments
          "Published $(git tag --points-at HEAD 'v*') from $(git rev-parse --short HEAD)." | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      # the release this commit carries, published here or by hand: the disk image goes into it
      - name: The release
        id: release
        run: |
          $tag = git tag --points-at HEAD 'v*' | Select-Object -First 1
          "tag=$tag" >> $env:GITHUB_OUTPUT

  # The macOS disk image: Brodgar launcher.app beside a link to Applications, to drag it there. Only macOS makes
  # one (hdiutil), so a macOS runner makes it from the release's own macOS zip, unpacked by ditto, which keeps the
  # zip's execute bits, and adds it to the release. The zip stays the asset a launcher updates itself from.
  dmg:
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: macos-latest
    steps:
      - name: Disk image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -e
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern brodgar.io-launcher-macos-arm64.zip --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/image"
          ditto -x -k "$RUNNER_TEMP/brodgar.io-launcher-macos-arm64.zip" "$RUNNER_TEMP/image"
          ln -s /Applications "$RUNNER_TEMP/image/Applications"
          hdiutil create -volname "Brodgar launcher" -srcfolder "$RUNNER_TEMP/image" -fs HFS+ -format UDZO -ov "$RUNNER_TEMP/brodgar.io-launcher-macos-arm64.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/brodgar.io-launcher-macos-arm64.dmg" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Added brodgar.io-launcher-macos-arm64.dmg to $TAG." >> "$GITHUB_STEP_SUMMARY"
