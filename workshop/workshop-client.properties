# The Steam Workshop item, read by Haven & Hearth's Steam launcher from the item's root. publish-steam.ps1
# builds it (`ant workshop`: this file, launcher.jar and the two files below, in build/workshop/) and uploads
# it, writing the visibility it is given here first -- README.md, "Steam Workshop". The launch is direct: the
# Steam launcher loads launcher.jar into its own JVM and calls io.brodgar.launcher.Workshop.main, which starts
# the launcher proper.
name=Brodgar
description-file=workshop-description.txt
preview-image=icon.png
visibility=private

main-class=io.brodgar.launcher.Workshop
class-path=launcher.jar
workshop-id=3801861235
